<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Crypto Radar" />
  <title>Crypto Radar LIVE</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=1.6.0" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">LOCAL · READ ONLY · v1.6</div>
        <h1>Crypto Radar</h1>
      </div>
      <button id="refreshBtn" class="icon-btn" aria-label="刷新">↻</button>
    </header>

    <main id="content" class="content"></main>

    <nav class="tabs" aria-label="Main navigation">
      <button data-tab="home" class="tab active"><span>⌂</span><small>首页</small></button>
      <button data-tab="portfolio" class="tab"><span>◫</span><small>持仓</small></button>
      <button data-tab="market" class="tab"><span>⌁</span><small>市场</small></button>
      <button data-tab="settings" class="tab"><span>⚙</span><small>状态</small></button>
    </nav>
  </div>

  <dialog id="startDialog" class="modal small">
    <div class="eyebrow">LIVE MARKET FIRST</div>
    <h2>先跑真实市场数据</h2>
    <div class="notice warning">
      这一版暂时不连接 Luno。先确认 BTC / ETH 的真实 Price、24H、Open Interest、Funding、Long/Short、ETF Flow 与 24H Cross-venue Liquidation 在你的 iPhone 能稳定读取。
    </div>
    <button id="startLiveBtn" class="btn primary full">进入 LIVE 市场</button>
    <p class="fineprint">不会使用 Demo 市场数字。某个来源失败时会显示“—”或 PARTIAL，不会拿假数据顶替。</p>
  </dialog>

  <div id="toast" class="toast hidden"></div>
  <script src="app-live16.js?v=1.6.0" defer></script>
</body>
</html>
