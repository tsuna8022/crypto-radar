name: Luno Read-only Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: luno-readonly-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install crypto helper
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Fetch Luno read-only data and encrypt snapshot
        env:
          LUNO_KEY_ID: ${{ secrets.LUNO_KEY_ID }}
          LUNO_KEY_SECRET: ${{ secrets.LUNO_KEY_SECRET }}
          CRYPTO_RADAR_SYNC_KEY: ${{ secrets.CRYPTO_RADAR_SYNC_KEY }}

        run: |
          python - <<'PY'
          import os
          import json
          import base64
          import urllib.request
          import urllib.parse
          import datetime
          import pathlib
          import time

          from cryptography.hazmat.primitives.ciphers.aead import AESGCM


          # ============================================================
          # BASIC CONFIG
          # ============================================================

          BASE = "https://api.luno.com"

          key_id = os.environ.get("LUNO_KEY_ID", "").strip()
          key_secret = os.environ.get("LUNO_KEY_SECRET", "").strip()
          sync_hex = os.environ.get("CRYPTO_RADAR_SYNC_KEY", "").strip()


          # ============================================================
          # VALIDATE SECRETS
          # ============================================================

          if not key_id:
              raise SystemExit("Missing LUNO_KEY_ID repository secret")

          if not key_secret:
              raise SystemExit("Missing LUNO_KEY_SECRET repository secret")

          if len(sync_hex) != 64:
              raise SystemExit(
                  "CRYPTO_RADAR_SYNC_KEY must be exactly 64 HEX characters"
              )

          try:
              sync_key = bytes.fromhex(sync_hex)
          except ValueError:
              raise SystemExit(
                  "CRYPTO_RADAR_SYNC_KEY must contain HEX characters only"
              )


          # ============================================================
          # LUNO AUTH
          # ============================================================

          auth = base64.b64encode(
              f"{key_id}:{key_secret}".encode("utf-8")
          ).decode("ascii")


          # ============================================================
          # HTTP GET HELPER
          # ============================================================

          def get(path, private=True, retries=2):
              url = BASE + path

              headers = {
                  "Accept": "application/json",
                  "User-Agent": "CryptoRadar-ReadOnly-Sync/2.1",
              }

              if private:
                  headers["Authorization"] = "Basic " + auth

              last_error = None

              for attempt in range(retries + 1):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers=headers,
                          method="GET",
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=25,
                      ) as response:
                          return json.loads(
                              response.read().decode("utf-8")
                          )

                  except Exception as exc:
                      last_error = exc

                      if attempt < retries:
                          time.sleep(1.5 * (attempt + 1))

              raise last_error


          # ============================================================
          # FETCH ALL TRANSACTIONS FROM ONE LUNO ACCOUNT
          # ============================================================

          def fetch_account_transactions(account_id):

              encoded_id = urllib.parse.quote(str(account_id))

              # First get latest 1000 rows
              response = get(
                  f"/api/1/accounts/{encoded_id}/transactions"
                  "?min_row=-1000&max_row=0",
                  True,
              )

              transactions = list(
                  response.get("transactions", [])
              )

              # Keep track so duplicated rows are not added
              seen_rows = set()

              for tx in transactions:
                  row = tx.get("row_index")
                  if row is not None:
                      seen_rows.add(str(row))

              # --------------------------------------------------------
              # If account has >1000 rows, walk backwards
              # Maximum 20,000 rows for safety
              # --------------------------------------------------------

              while transactions and len(transactions) < 20000:

                  row_numbers = []

                  for tx in transactions:
                      row = tx.get("row_index")

                      try:
                          row_numbers.append(int(row))
                      except (TypeError, ValueError):
                          pass

                  if not row_numbers:
                      break

                  oldest_row = min(row_numbers)

                  if oldest_row <= 1:
                      break

                  next_max = oldest_row
                  next_min = max(1, next_max - 1000)

                  older_response = get(
                      f"/api/1/accounts/{encoded_id}/transactions"
                      f"?min_row={next_min}"
                      f"&max_row={next_max}",
                      True,
                  )

                  older_transactions = older_response.get(
                      "transactions",
                      [],
                  )

                  added = 0

                  for tx in older_transactions:
                      row = tx.get("row_index")
                      row_key = str(row)

                      if row_key not in seen_rows:
                          seen_rows.add(row_key)
                          transactions.append(tx)
                          added += 1

                  if added == 0:
                      break

              # Oldest -> newest
              transactions.sort(
                  key=lambda tx: (
                      int(tx.get("timestamp", 0) or 0),
                      int(tx.get("row_index", 0) or 0),
                  )
              )

              return transactions


          # ============================================================
          # START FETCHING DATA
          # ============================================================

          warnings = []


          # ============================================================
          # 1. BALANCES
          # ============================================================

          balance_response = get(
              "/api/1/balance",
              True,
          )

          balances = balance_response.get(
              "balance",
              [],
          )


          # ============================================================
          # 2. ACCOUNT TRANSACTION HISTORY
          #
          # Read:
          # - XBT / BTC accounts
          # - ETH normal wallet
          # - ETH staking wallet
          # - MYR wallet
          #
          # We save RAW transaction history.
          # We DO NOT guess cost basis here.
          # ============================================================

          account_transactions = []

          supported_assets = {
              "XBT",
              "BTC",
              "ETH",
              "MYR",
          }

          for account in balances:

              asset = str(
                  account.get("asset") or ""
              ).upper()

              if asset not in supported_assets:
                  continue

              account_id = account.get("account_id")

              if not account_id:
                  continue

              try:
                  transactions = fetch_account_transactions(
                      account_id
                  )

                  account_transactions.append({
                      "accountId": str(account_id),
                      "asset": asset,
                      "accountType": account.get("account_type"),
                      "name": account.get("name"),
                      "transactions": transactions,
                  })

                  print(
                      f"{asset} account "
                      f"{account_id}: "
                      f"{len(transactions)} transaction rows"
                  )

              except Exception as exc:

                  warnings.append(
                      f"{asset} account {account_id} "
                      f"transaction history unavailable: "
                      f"{type(exc).__name__}: {exc}"
                  )

                  account_transactions.append({
                      "accountId": str(account_id),
                      "asset": asset,
                      "accountType": account.get("account_type"),
                      "name": account.get("name"),
                      "transactions": [],
                      "error": f"{type(exc).__name__}: {exc}",
                  })


          # ============================================================
          # 3. LUNO CURRENT BTC/MYR PRICE
          # ============================================================

          try:
              btc_ticker = get(
                  "/api/1/ticker?pair=XBTMYR",
                  False,
              )

              btc_myr = btc_ticker.get("last_trade")

          except Exception as exc:
              btc_myr = None

              warnings.append(
                  "XBTMYR ticker unavailable: "
                  f"{type(exc).__name__}: {exc}"
              )


          # ============================================================
          # 4. LUNO CURRENT ETH/MYR PRICE
          # ============================================================

          try:
              eth_ticker = get(
                  "/api/1/ticker?pair=ETHMYR",
                  False,
              )

              eth_myr = eth_ticker.get("last_trade")

          except Exception as exc:
              eth_myr = None

              warnings.append(
                  "ETHMYR ticker unavailable: "
                  f"{type(exc).__name__}: {exc}"
              )


          # ============================================================
          # 5. SAFE DIAGNOSTIC
          #
          # Only print counts.
          # NEVER print transaction contents / secrets.
          # ============================================================

          print("")
          print("===== CRYPTO RADAR LUNO SYNC =====")
          print(f"Balance accounts: {len(balances)}")

          total_transaction_rows = 0

          for item in account_transactions:

              rows = len(
                  item.get("transactions", [])
              )

              total_transaction_rows += rows

              print(
                  f"{item.get('asset')} | "
                  f"{item.get('accountType')} | "
                  f"rows={rows}"
              )

          print(
              f"Total account transaction rows: "
              f"{total_transaction_rows}"
          )

          print(
              f"BTC/MYR ticker: "
              f"{'OK' if btc_myr else 'Unavailable'}"
          )

          print(
              f"ETH/MYR ticker: "
              f"{'OK' if eth_myr else 'Unavailable'}"
          )

          if warnings:
              print("Warnings:")

              for warning in warnings:
                  print(" - " + warning)

          print("==================================")
          print("")


          # ============================================================
          # 6. CREATE SNAPSHOT
          # ============================================================

          generated_at = (
              datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat()
          )

          payload = {
              "schema": "crypto-radar-luno-snapshot-v2",

              "generatedAt": generated_at,

              # Actual Luno balances
              "balances": balances,

              # Full account transaction ledger
              "accountTransactions": account_transactions,

              # Keep old fields so old frontend will not crash.
              # v2.1 frontend will use accountTransactions instead.
              "btcTrades": [],
              "ethTrades": [],

              # Current MYR prices
              "btcMYR": btc_myr,
              "ethMYR": eth_myr,

              "warnings": warnings,
          }


          # ============================================================
          # 7. CONVERT SNAPSHOT TO JSON
          # ============================================================

          plain = json.dumps(
              payload,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode("utf-8")


          # ============================================================
          # 8. AES-256-GCM ENCRYPTION
          #
          # IMPORTANT:
          # Keep this AAD unchanged because your existing webpage
          # decryptor already uses crypto-radar-luno-v1.
          # ============================================================

          iv = os.urandom(12)

          aad = b"crypto-radar-luno-v1"

          ciphertext = AESGCM(
              sync_key
          ).encrypt(
              iv,
              plain,
              aad,
          )


          # ============================================================
          # 9. ENCRYPTED FILE
          # ============================================================

          encrypted_output = {
              "v": 1,
              "alg": "AES-256-GCM",

              "iv": base64.b64encode(
                  iv
              ).decode("ascii"),

              "ct": base64.b64encode(
                  ciphertext
              ).decode("ascii"),

              "updatedAt": generated_at,
          }


          # ============================================================
          # 10. SAVE
          # ============================================================

          pathlib.Path(
              "data"
          ).mkdir(
              exist_ok=True
          )

          pathlib.Path(
              "data/luno.enc.json"
          ).write_text(
              json.dumps(
                  encrypted_output,
                  separators=(",", ":"),
              ),
              encoding="utf-8",
          )


          print(
              "Encrypted Luno snapshot v2 "
              "created successfully"
          )

          PY


      # ==============================================================
      # COMMIT ENCRYPTED SNAPSHOT BACK TO GITHUB
      # ==============================================================

      - name: Commit encrypted snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/luno.enc.json

          if git diff --cached --quiet; then
            echo "No snapshot change to commit."
            exit 0
          fi

          git commit -m "chore: update encrypted Luno snapshot"
          git push
