name: Luno Read-only Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install crypto helper
        run: pip install cryptography

      - name: Fetch Luno account history and encrypt snapshot
        env:
          LUNO_KEY_ID: ${{ secrets.LUNO_KEY_ID }}
          LUNO_KEY_SECRET: ${{ secrets.LUNO_KEY_SECRET }}
          CRYPTO_RADAR_SYNC_KEY: ${{ secrets.CRYPTO_RADAR_SYNC_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import base64
          import urllib.request
          import urllib.parse
          import datetime
          import pathlib
          from decimal import Decimal, InvalidOperation
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          BASE = "https://api.luno.com"

          key_id = os.environ.get("LUNO_KEY_ID", "").strip()
          key_secret = os.environ.get("LUNO_KEY_SECRET", "").strip()
          sync_hex = os.environ.get("CRYPTO_RADAR_SYNC_KEY", "").strip()

          if not key_id:
              raise RuntimeError("Missing LUNO_KEY_ID")

          if not key_secret:
              raise RuntimeError("Missing LUNO_KEY_SECRET")

          if not sync_hex:
              raise RuntimeError("Missing CRYPTO_RADAR_SYNC_KEY")

          try:
              sync_key = bytes.fromhex(sync_hex)
          except Exception:
              raise RuntimeError(
                  "CRYPTO_RADAR_SYNC_KEY must be a 64-character HEX key"
              )

          if len(sync_key) != 32:
              raise RuntimeError(
                  "CRYPTO_RADAR_SYNC_KEY must decode to exactly 32 bytes"
              )

          auth = base64.b64encode(
              f"{key_id}:{key_secret}".encode()
          ).decode()

          def get(path, authenticated=True):
              req = urllib.request.Request(
                  BASE + path,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "CryptoRadar-LunoSync/2.1",
                      **(
                          {"Authorization": "Basic " + auth}
                          if authenticated
                          else {}
                      ),
                  },
              )

              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          def dec(v):
              try:
                  return Decimal(str(v))
              except (InvalidOperation, TypeError, ValueError):
                  return Decimal("0")

          # ------------------------------------------------------------
          # 1. Read ALL Luno balances/accounts
          # ------------------------------------------------------------

          balance_payload = get("/api/1/balance", True)
          balances = balance_payload.get("balance", [])

          wanted_accounts = []

          for account in balances:
              asset = str(account.get("asset", "")).upper()

              if asset not in ("XBT", "BTC", "ETH"):
                  continue

              account_id = str(account.get("account_id", "")).strip()

              if not account_id:
                  continue

              wanted_accounts.append({
                  "account_id": account_id,
                  "asset": "XBT" if asset == "BTC" else asset,
                  "account_type": account.get("account_type"),
                  "balance": account.get("balance"),
                  "reserved": account.get("reserved"),
                  "unconfirmed": account.get("unconfirmed"),
                  "name": account.get("name"),
              })

          print("Relevant Luno accounts:", len(wanted_accounts))

          for a in wanted_accounts:
              print(
                  "Account",
                  a["account_id"],
                  a["asset"],
                  a.get("account_type"),
                  a.get("balance"),
              )

          # ------------------------------------------------------------
          # 2. Read transaction history for every BTC / ETH account
          # ------------------------------------------------------------

          def fetch_account_transactions(account_id):
              all_rows = []

              # First get up to 1000 newest rows.
              path = (
                  f"/api/1/accounts/{account_id}/transactions"
                  "?min_row=-1000&max_row=0"
              )

              data = get(path, True)
              rows = data.get("transactions", []) or []

              all_rows.extend(rows)

              # If exactly 1000 returned, continue backwards.
              while len(rows) >= 1000:
                  indexes = []

                  for row in rows:
                      try:
                          indexes.append(int(row.get("row_index")))
                      except Exception:
                          pass

                  if not indexes:
                      break

                  oldest = min(indexes)

                  if oldest <= 1:
                      break

                  max_row = oldest
                  min_row = max(1, max_row - 1000)

                  path = (
                      f"/api/1/accounts/{account_id}/transactions"
                      f"?min_row={min_row}&max_row={max_row}"
                  )

                  data = get(path, True)
                  rows = data.get("transactions", []) or []

                  if not rows:
                      break

                  all_rows.extend(rows)

              # Deduplicate using row_index.
              unique = {}

              for row in all_rows:
                  idx = str(row.get("row_index", ""))

                  if idx:
                      unique[idx] = row

              result = list(unique.values())

              result.sort(
                  key=lambda x: int(x.get("row_index", 0))
              )

              return result

          accounts_with_transactions = []

          for account in wanted_accounts:
              aid = account["account_id"]

              try:
                  txs = fetch_account_transactions(aid)
                  print(
                      "Transactions:",
                      account["asset"],
                      account.get("account_type"),
                      aid,
                      len(txs),
                  )
              except Exception as e:
                  print(
                      "Transaction read failed:",
                      aid,
                      repr(e),
                  )
                  txs = []

              item = dict(account)
              item["transactions"] = txs
              accounts_with_transactions.append(item)

          # ------------------------------------------------------------
          # 3. Convert Luno account trade entries into normalized trades
          #
          # Existing Crypto Radar expects:
          # is_buy / price / volume / timestamp
          # ------------------------------------------------------------

          def normalise_trade(asset, tx):
              details = tx.get("detail_fields") or {}
              trade = details.get("trade_details") or {}

              if not trade:
                  return None

              pair = str(trade.get("pair", "")).upper()

              # Malaysia MYR pairs only for current Crypto Radar.
              allowed_pairs = (
                  ("XBTMYR", "BTCMYR")
                  if asset == "XBT"
                  else ("ETHMYR",)
              )

              if pair not in allowed_pairs:
                  return None

              price = dec(trade.get("price"))
              volume = abs(dec(trade.get("volume")))

              # Prefer actual asset account balance movement.
              delta = dec(tx.get("balance_delta"))

              if volume <= 0 and delta != 0:
                  volume = abs(delta)

              if price <= 0 or volume <= 0:
                  return None

              # Crypto asset entering wallet = BUY.
              # Crypto asset leaving wallet through a trade = SELL.
              is_buy = delta > 0

              return {
                  "is_buy": bool(is_buy),
                  "price": str(price),
                  "volume": str(volume),
                  "timestamp": int(tx.get("timestamp") or 0),
                  "pair": pair,
                  "source": "account_transaction",
                  "account_id": str(tx.get("account_id", "")),
                  "row_index": tx.get("row_index"),
                  "kind": tx.get("kind"),
                  "description": tx.get("description"),
                  "balance_delta": str(tx.get("balance_delta", "0")),
              }

          btc_trades = []
          eth_trades = []

          for account in accounts_with_transactions:
              asset = account["asset"]

              for tx in account["transactions"]:
                  t = normalise_trade(asset, tx)

                  if not t:
                      continue

                  if asset == "XBT":
                      btc_trades.append(t)

                  elif asset == "ETH":
                      eth_trades.append(t)

          def dedupe_trades(rows):
              seen = set()
              result = []

              for t in rows:
                  k = (
                      t.get("account_id"),
                      t.get("row_index"),
                      t.get("timestamp"),
                      t.get("price"),
                      t.get("volume"),
                      t.get("is_buy"),
                  )

                  if k in seen:
                      continue

                  seen.add(k)
                  result.append(t)

              result.sort(
                  key=lambda x: int(x.get("timestamp") or 0)
              )

              return result

          btc_trades = dedupe_trades(btc_trades)
          eth_trades = dedupe_trades(eth_trades)

          print("BTC trade records found:", len(btc_trades))
          print("ETH trade records found:", len(eth_trades))

          # ------------------------------------------------------------
          # 4. Public MYR ticker snapshot
          # ------------------------------------------------------------

          warnings = []

          try:
              btc_myr = get(
                  "/api/1/ticker?pair=XBTMYR",
                  False,
              ).get("last_trade")
          except Exception as e:
              btc_myr = None
              warnings.append(
                  "XBTMYR ticker unavailable: " + repr(e)
              )

          try:
              eth_myr = get(
                  "/api/1/ticker?pair=ETHMYR",
                  False,
              ).get("last_trade")
          except Exception as e:
              eth_myr = None
              warnings.append(
                  "ETHMYR ticker unavailable: " + repr(e)
              )

          # ------------------------------------------------------------
          # 5. Build encrypted snapshot
          # ------------------------------------------------------------

          generated_at = datetime.datetime.now(
              datetime.timezone.utc
          ).isoformat()

          payload = {
              "schema": "crypto-radar-luno-snapshot-v2",
              "generatedAt": generated_at,

              # Keep old fields so current v2.0 App can still read them.
              "balances": balances,
              "btcTrades": btc_trades,
              "ethTrades": eth_trades,
              "btcMYR": btc_myr,
              "ethMYR": eth_myr,

              # New v2.1 fields.
              "accounts": accounts_with_transactions,
              "historySource": "account_transactions",
              "tradeCounts": {
                  "btc": len(btc_trades),
                  "eth": len(eth_trades),
              },
              "warnings": warnings,
          }

          plain = json.dumps(
              payload,
              separators=(",", ":"),
              ensure_ascii=False,
          ).encode()

          iv = os.urandom(12)
          aad = b"crypto-radar-luno-v1"

          ct = AESGCM(sync_key).encrypt(
              iv,
              plain,
              aad,
          )

          out = {
              "v": 1,
              "alg": "AES-256-GCM",
              "iv": base64.b64encode(iv).decode(),
              "ct": base64.b64encode(ct).decode(),
              "updatedAt": generated_at,
          }

          pathlib.Path("data").mkdir(exist_ok=True)

          pathlib.Path(
              "data/luno.enc.json"
          ).write_text(
              json.dumps(
                  out,
                  separators=(",", ":"),
              ),
              encoding="utf-8",
          )

          print("Encrypted Luno snapshot created successfully")
          print("BTC trades:", len(btc_trades))
          print("ETH trades:", len(eth_trades))

          if warnings:
              print("Warnings:")
              for w in warnings:
                  print("-", w)
          PY

      - name: Commit encrypted snapshot
        run: |
          git config user.name "crypto-radar-bot"
          git config user.email "crypto-radar-bot@users.noreply.github.com"

          git add data/luno.enc.json

          if git diff --cached --quiet; then
            echo "No snapshot change"
            exit 0
          fi

          git commit -m "Update encrypted Luno snapshot"

          git pull --rebase origin main

          git push origin main
